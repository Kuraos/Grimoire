# Compila el instalador de Windows y lo publica como release firmado.
#
# Sustituye al `npm run desktop:build` local: en vez de esperar ~6 min con la
# máquina ocupada, la compilación ocurre en la nube y la app instalada se
# actualiza sola desde Ajustes.
#
# DOS FORMAS DE DISPARARLO, y las dos acaban en el mismo sitio:
#
#   por etiqueta   bump de "version" en tauri.conf.json, luego
#                  `git tag v0.2.0 && git push origin v0.2.0`
#   a mano         Actions -> Release -> Run workflow, escribiendo la etiqueta.
#                  Para reintentar una compilación que falló sin borrar y
#                  reponer la etiqueta, y para publicar desde donde no se
#                  pueden empujar refs. Dispáralo desde `master`: la etiqueta
#                  que no existe se crea sobre la rama desde la que corres.
#
# Después, publicar el borrador del release: eso es manual a propósito, porque
# mientras siga en borrador sus archivos no son descargables y ningún cliente
# ve la actualización.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a publicar, con la v delante (vX.Y.Z). Debe coincidir con la version de tauri.conf.json."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # De dónde sale la etiqueta, y si vale.
      #
      # Este paso existía sólo para las etiquetas empujadas —llevaba un
      # `if: startsWith(github.ref, 'refs/tags/')`— y a `tauri-action` se le
      # pasaba `github.ref_name` a secas. Disparado a mano eso valía `master`:
      # la verificación se saltaba sola y salía un release etiquetado «master»
      # con la versión sin comprobar. El disparo manual estaba puesto y no
      # servía para lo único que se le pide.
      #
      # Ahora la etiqueta se resuelve una vez, se comprueba SIEMPRE, y de aquí
      # sale la que usa el resto del workflow.
      - name: Resolver y verificar la etiqueta
        id: release
        shell: pwsh
        env:
          # Por `env` y no interpolado dentro del script: lo que llega por
          # `inputs` es texto que escribe una persona, y pegarlo en el cuerpo
          # lo convertiría en código. Aquí entra como dato.
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT -eq 'workflow_dispatch') { "$env:DISPATCH_TAG".Trim() } else { "$env:PUSH_TAG" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "La etiqueta '$tag' no tiene la forma vX.Y.Z."
            exit 1
          }
          # El updater compara la versión de tauri.conf.json, NO la etiqueta. Si
          # no coinciden, el release sale con la versión vieja y la
          # actualización jamás se ofrece: un fallo mudo y caro de diagnosticar.
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (($tag -replace '^v', '') -ne $conf) {
            Write-Error "Etiqueta '$tag' != tauri.conf.json '$conf'. Ajusta la version antes de publicar."
            exit 1
          }
          Write-Host "Version a publicar: $conf (etiqueta $tag)"
          "tag=$tag" | Add-Content -Path $env:GITHUB_OUTPUT

      # Node 24 = npm 11, el mismo que genera el lockfile (ver ci.yml).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Dependencias de Node
        shell: pwsh
        run: |
          npm ci
          npm --prefix frontend ci

      # build_sidecar.ps1 usa backend/.venv; en un runner limpio hay que crearlo.
      - name: Entorno de Python del backend
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          backend/.venv/Scripts/python.exe -m pip install -r backend/requirements.txt

      - name: Empaquetar el backend como sidecar (PyInstaller)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File backend/build_sidecar.ps1 -Force

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clave minisign generada con `tauri signer generate`. Sin ella el
          # bundle sale sin firma y el updater rechaza la actualización.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # La resuelta y verificada arriba, no `github.ref_name`: en un
          # disparo manual esa vale el nombre de la rama.
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: "Grimoire v__VERSION__"
          releaseBody: |
            Instalador de Windows (`.exe`). Si ya tienes Grimoire instalado no
            hace falta descargar nada: la app detecta la versión y se actualiza
            desde **Ajustes → Actualizaciones**.
          releaseDraft: true
          prerelease: false
          # El updater de Windows funciona mejor con el instalador NSIS que con
          # el .msi, que exige elevación y deja la instalación a medias más a menudo.
          updaterJsonPreferNsis: true
