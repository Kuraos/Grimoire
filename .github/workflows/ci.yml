# Verificación automática en cada push y pull request.
# No compila el instalador (eso tarda ~6 min y sólo hace falta al publicar):
# aquí se valida lo que se rompe a diario — tipos, tests y build del frontend.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Tipos (tsc)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Tests (vitest)
        working-directory: frontend
        run: npx vitest run

      - name: Build de producción
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Tests (pytest)
        working-directory: backend
        # GRIMOIRE_DB apunta a un archivo temporal: los tests nunca tocan datos reales
        env:
          GRIMOIRE_DB: /tmp/grimoire-ci.db
        run: python -m pytest tests/ -q
